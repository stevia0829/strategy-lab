[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strategylab-replay"
version = "0.1.0"
description = "Independent Python engine for configurable daily-bar backtesting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
market = ["psycopg[binary]>=3.2,<3.3"]

[project.scripts]
strategylab = "strategylab.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
